name: Publish checked merchant offers stage1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-merchant-stage1.yml']
permissions: {}
concurrency:
  group: catalog-checkout-release
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the exact reviewed offer snapshot
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://raw.githubusercontent.com/aaahoneydo-arch/urban-clothes-market/c8468f264b11404bb27f1a80a2b3ca27a33795bc/checkout/merchant-offers-stage1.b64 |
            base64 --decode | gzip --decompress > "$RUNNER_TEMP/offers.ndjson"
          echo '04e6d00ba791e15d5cd6a9d9125a5c9070b801fb3ec48bbe1e65b7cb7cceded6  '"$RUNNER_TEMP/offers.ndjson" | sha256sum -c -
      - name: Repair checkout links in this storefront
        run: python3 scripts/checkout-links.py "$RUNNER_TEMP/offers.ndjson"
      - name: Save the release on main
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/apply-merchant-stage1.yml
          git add -u
          for file in checkout/withheld.json checkout/legacy-routes.json; do
            if test -f "$file"; then git add -- "$file"; fi
          done
          git commit -m "Publish exact merchant checkouts for the stage1 audit"
          git push origin HEAD:refs/heads/main
