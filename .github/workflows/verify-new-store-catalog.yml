name: Verify the full Spreadshirt catalog
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-new-store-catalog.yml']
permissions: {}
jobs:
  offers:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        start: [0, 7500, 15000]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            checkout
          persist-credentials: false
      - name: Read original published SKU inventory and previous exact checks
        env:
          RAW: https://raw.githubusercontent.com/aaahoneydo-arch/jason-coleman-media-network/1645228848c65200cf56434eb0d1e2b4c5a46cee
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 "$RAW/catalog-additions.json" -o "$RUNNER_TEMP/add.json"
          curl -fsSL --retry 2 "$RAW/real_products_catalog.json" -o "$RUNNER_TEMP/base.json"
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          rows={}
          for f in ['add.json','base.json']:
              for row in json.loads((p/f).read_text()):
                  if row['store'].lower()=='spreadshop':rows.setdefault(row['id'],row)
          assert len(rows)==22075, len(rows)
          (p/'all.json').write_text(json.dumps(list(rows.values())))
          PY
          base64 -d checkout/merchant-offers-stage1.b64 | gzip -dc > "$RUNNER_TEMP/prior.ndjson"
      - name: Verify seller, design, SKU, color, stock and exact offer URL
        env:
          START: ${{ matrix.start }}
        run: |
          python3 scripts/verify-purchases.py --source "$RUNNER_TEMP/all.json" --prior "$RUNNER_TEMP/prior.ndjson" \
            --output "$RUNNER_TEMP/offers-$START.ndjson" --start "$START" --stop "$((START+7500))" --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-${{ matrix.start }}
          path: ${{ runner.temp }}/offers-*.ndjson
          if-no-files-found: error
          retention-days: 7
  save:
    needs: offers
    if: always() && github.actor == github.repository_owner && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            checkout
            .github/workflows
      - uses: actions/download-artifact@v4
        with:
          pattern: checked-*
          merge-multiple: true
          path: ${{ runner.temp }}/receipts
      - name: Save checked public seller data for review
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,json,gzip,base64,collections
          receipts=pathlib.Path(os.environ['RUNNER_TEMP'])/'receipts'
          prior=gzip.decompress(base64.decodebytes(pathlib.Path('checkout/merchant-offers-stage1.b64').read_bytes())).decode()
          rows={}
          for records in [prior,*[p.read_text() for p in sorted(receipts.glob('*.ndjson'))]]:
              for line in records.splitlines():
                  if line.strip():
                      r=json.loads(line)
                      if r['shop']=='spreadshop':rows[r['id']]=r
          result=''.join(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n' for x in rows.values())
          summary={'expected':22075,'checked':len(rows),'status':dict(collections.Counter(r['status'] for r in rows.values()))}
          pathlib.Path('checkout/spreadshirt-checkout-evidence.ndjson.gz').write_bytes(gzip.compress(result.encode(),mtime=0))
          pathlib.Path('checkout/spreadshirt-checkout-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(summary)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checkout/spreadshirt-checkout-evidence.ndjson.gz checkout/spreadshirt-checkout-summary.json
          git rm -- .github/workflows/verify-new-store-catalog.yml
          git commit -m 'Save exact seller checkout evidence for the two-storefront rebuild'
          git fetch --depth=10 origin main
          git rebase origin/main
          git push origin HEAD:refs/heads/main
